<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltrix AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --border-color: #333333;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }
        #sidebar {
            width: 260px;
            background-color: #181818;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }
        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .chat-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            color: #ddd;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-item:hover, .chat-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }
        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .top-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn:hover {
            background-color: #2a2a2a;
        }
        .btn-primary {
            background-color: var(--accent-color);
            border: none;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .icon-btn {
            padding: 8px;
            border-radius: 8px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .icon-btn:hover {
            background-color: #2a2a2a;
        }
        #chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }
        .welcome-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .welcome-sub {
            color: #aaa;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user {
            background-color: #2b5278;
            align-self: flex-end;
        }
        .message.ai {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }
        #input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
            position: relative;
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
        }
        #user-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }
        .plus-menu {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex-direction: column;
            z-index: 100;
        }
        .plus-menu.show {
            display: flex;
        }
        .plus-menu-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .plus-menu-item:hover {
            background-color: #2a2a2a;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border-color);
        }
        .modal-content input, .modal-content select {
            padding: 10px;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
        }
    </style>
</head>

        };

        let currentLang = 'tr';

        window.togglePlusMenu = function(event) {
            event.stopPropagation();
            const menu = document.getElementById('plus-menu');
            menu.classList.toggle('show');
        };

        window.openSettingsModal = function() {
            document.getElementById('settings-modal').style.display = 'flex';
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').style.display = 'none';
        };

        window.createNewChat = function() {
            const chatList = document.getElementById('chat-list');
            const chatItem = document.createElement('div');
            chatItem.className = 'chat-item active';
            chatItem.textContent = translations[currentLang].newChatDefault || "Yeni Sohbet";
            
            // Remove active from others
            document.querySelectorAll('.chat-item').forEach(el => el.classList.remove('active'));
            chatList.prepend(chatItem);
            
            // Clear chat area to show welcome screen or reset
            document.getElementById('chat-area').innerHTML = `
                <div class="welcome-container" id="welcome-box">
                    <h2 class="welcome-title">Veltrix AI</h2>
                    <p id="welcome-sub-text" class="welcome-sub">${translations[currentLang].welcomeSub}</p>
                </div>
            `;
        };

        window.sendMessage = function() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(!text) return;

            const chatArea = document.getElementById('chat-area');
            const welcomeBox = document.getElementById('welcome-box');
            if(welcomeBox) welcomeBox.remove();

            // User message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chatArea.appendChild(userMsg);
            input.value = '';

            // AI response placeholder
            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'message ai';
                aiMsg.textContent = translations[currentLang].aiResponse;
                chatArea.appendChild(aiMsg);
                chatArea.scrollTop = chatArea.scrollHeight;
            }, 500);

            chatArea.scrollTop = chatArea.scrollHeight;
        };

        window.updateLanguageFromSettings = function() {
            const select = document.getElementById('settings-lang-select');
            currentLang = select.value;
            
            // Update text elements based on data-i18n
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[currentLang][key]) {
                    el.textContent = translations[currentLang][key];
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[currentLang][key]) {
                    el.setAttribute('placeholder', translations[currentLang][key]);
                }
            });

            document.getElementById('current-lang-name').textContent = translations[currentLang].langName;
            closeSettingsModal();
        };

        // Close plus menu on outside click
        window.addEventListener('click', () => {
            const menu = document.getElementById('plus-menu');
            if(menu) menu.classList.remove('show');
        });
    </script>
