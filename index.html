<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltrix AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            width: 260px;
            background-color: #181818;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 10px;
        }

        #chat-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .chat-item {
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            color: #ddd;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .chat-item:hover, .chat-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #2a2a2a;
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        #chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .welcome-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
        }

        .welcome-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .welcome-sub {
            color: #aaa;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 75%;
            line-height: 1.5;
            word-break: break-word;
        }

        .message.user {
            background-color: #2b5278;
            align-self: flex-end;
        }

        .message.ai {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            align-self: flex-start;
        }

        #input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            position: relative;
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
        }

        #user-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }

        .plus-menu {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex-direction: column;
            z-index: 100;
        }

        .plus-menu.show {
            display: flex;
        }

        .plus-menu-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .plus-menu-item:hover {
            background-color: #2a2a2a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        .modal-content input, .modal-content select {
            padding: 10px;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="sidebar">
            <button id="btn-new-chat" class="btn btn-primary" onclick="createNewChat()">Yeni Sohbet</button>
            <div id="chat-list"></div>
            <button onclick="openSettingsModal()" class="btn">⚙️ Ayarlar</button>
        </div>

        <div id="main-content">
            <div class="top-bar">
                <span id="current-lang-name">Türkçe</span>
                <button class="btn" id="btn-open-auth" onclick="document.getElementById('auth-modal').style.display='flex'">Giriş Yap</button>
            </div>

            <div id="chat-area">
                <div class="welcome-container" id="welcome-box">
                    <h2 class="welcome-title">Veltrix AI</h2>
                    <p id="welcome-sub-text" class="welcome-sub">Size nasıl yardımcı olabilirim?</p>
                </div>
            </div>

            <div id="input-container">
                <button class="btn" onclick="togglePlusMenu(event)">+</button>
                <div id="plus-menu" class="plus-menu">
                    <div id="menu-gallery" class="plus-menu-item">Galeri</div>
                    <div id="menu-camera" class="plus-menu-item" onclick="document.getElementById('camera-modal').style.display='flex'">Kamera</div>
                </div>

                <input type="text" id="user-input" placeholder="Bir mesaj yazın..." onkeydown="if(event.key==='Enter') sendMessage()">
                <button id="btn-send" class="btn btn-primary" onclick="sendMessage()">Gönder</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Giriş Yap / Kayıt Ol</h3>
            <button id="btn-google" class="btn" style="background: #ffffff; color: #000; font-weight: bold;">
                <span id="btn-google-text">Google ile Giriş Yap</span>
            </button>
            <div style="text-align: center; color: #666; font-size: 12px;">veya</div>
            <input type="email" id="auth-email" placeholder="E-posta Adresi">
            <input type="password" id="auth-password" placeholder="Şifre">
            <button id="btn-submit-email" class="btn btn-primary">Devam Et</button>
            <button class="btn" onclick="document.getElementById('auth-modal').style.display='none'">İptal</button>
        </div>
    </div>

    <div id="camera-modal" class="modal">
        <div class="modal-content">
            <h3 id="cam-title">Kamera</h3>
            <div style="width: 100%; height: 180px; background: #000; border-radius: 8px;"></div>
            <button id="cam-snap-btn" class="btn btn-primary">Fotoğraf Çek</button>
            <button id="cam-close-btn" class="btn" onclick="document.getElementById('camera-modal').style.display='none'">İptal</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 id="settings-title">Ayarlar</h3>
            <label id="settings-lang-label" for="settings-lang-select">Uygulama Dili</label>
            <select id="settings-lang-select">
                <option value="tr">Türkçe</option>
                <option value="es">Español</option>
            </select>
            <button id="btn-settings-save" class="btn btn-primary" onclick="updateLanguageFromSettings()">Kaydet</button>
            <button id="btn-settings-cancel" class="btn" onclick="closeSettingsModal()">İptal</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpe5dskNAllAKDn0UjB_uHKBhQJfWRg1c",
            authDomain: "veltrix-ai-63b94.firebaseapp.com",
            projectId: "veltrix-ai-63b94",
            storageBucket: "veltrix-ai-63b94.firebasestorage.app",
            messagingSenderId: "539377938284",
            appId: "1:539377938284:web:efb25fd388b8a58c01cd49",
            measurementId: "G-WQJN5W5LVX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const translations = {
            tr: {
                langName: "Türkçe",
                newChat: "Yeni Sohbet",
                welcomeSub: "Size nasıl yardımcı olabilirim?",
                placeholder: "Bir mesaj yazın...",
                send: "Gönder",
                gallery: "Galeri",
                camera: "Kamera",
                camTitle: "Kamera",
                snap: "Fotoğraf Çek",
                cancel: "İptal",
                authTitle: "Giriş Yap / Kayıt Ol",
                googleBtn: "Google ile Giriş Yap",
                emailBtn: "E-posta ile Giriş Yap",
                phoneBtn: "Telefon ile Giriş Yap",
                emailPlaceholder: "E-posta Adresi",
                passPlaceholder: "Şifre",
                submitEmail: "Devam Et",
                back: "Geri",
                phoneSoon: "Pek Yakında!",
                settings: "Ayarlar",
                settingsLang: "Uygulama Dili",
                save: "Kaydet",
                newChatDefault: "Yeni Sohbet"
            },
            es: {
                langName: "Español",
                newChat: "Nuevo Chat",
                welcomeSub: "¿Cómo puedo ayudarte hoy?",
                placeholder: "Escribe un mensaje...",
                send: "Enviar",
                gallery: "Galería",
                camera: "Cámara",
                camTitle: "Cámara",
                snap: "Tomar Foto",
                cancel: "Cancelar",
                authTitle: "Iniciar Sesión / Registrarse",
                googleBtn: "Continuar con Google",
                emailBtn: "Continuar con Email",
                phoneBtn: "Continuar con Teléfono",
                emailPlaceholder: "Correo Electrónico",
                passPlaceholder: "Contraseña",
                submitEmail: "Continuar",
                back: "Atrás",
                phoneSoon: "¡Próximamente!",
                settings: "Ajustes",
                settingsLang: "Idioma de la Aplicación",
                save: "Guardar",
                newChatDefault: "Nuevo Chat"
            }
        };

        let currentLang = localStorage.getItem('app_lang') || 'tr';
        let chats = [{ id: 1, title: 'Yeni Sohbet', messages: [] }];
        let currentChatId = 1;

        function setSafeText(id, val) {
            const el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = val;
                } else {
                    el.textContent = val;
                }
            }
        }

        window.applyLanguage = function(lang) {
            const t = translations[lang] || translations.tr;
            currentLang = lang;
            localStorage.setItem('app_lang', lang);

            setSafeText('current-lang-name', t.langName);
            setSafeText('btn-new-chat', t.newChat);
            setSafeText('welcome-sub-text', t.welcomeSub);
            setSafeText('user-input', t.placeholder);
            setSafeText('btn-send', t.send);
            setSafeText('menu-gallery', t.gallery);
            setSafeText('menu-camera', t.camera);
            setSafeText('cam-title', t.camTitle);
            setSafeText('cam-snap-btn', t.snap);
            setSafeText('cam-close-btn', t.cancel);
            setSafeText('modal-title', t.authTitle);
            setSafeText('btn-google-text', t.googleBtn);
            setSafeText('auth-email', t.emailPlaceholder);
            setSafeText('auth-password', t.passPlaceholder);
            setSafeText('btn-submit-email', t.submitEmail);
            setSafeText('settings-title', t.settings);
            setSafeText('settings-lang-label', t.settingsLang);
            setSafeText('btn-settings-save', t.save);
            setSafeText('btn-settings-cancel', t.cancel);
        }

        window.createNewChat = function() {
            const t = translations[currentLang];
            const newChat = { id: Date.now(), title: t.newChatDefault, messages: [] };
            chats.push(newChat);
            currentChatId = newChat.id;
            renderChatList();
            renderActiveChat();
        };

        window.renderChatList = function() {
            const listEl = document.getElementById('chat-list');
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.textContent = chat.title;
                div.onclick = () => {
                    currentChatId = chat.id;
                    renderChatList();
                    renderActiveChat();
                };
                listEl.appendChild(div);
            });
        };

        window.renderActiveChat = function() {
            const chatArea = document.getElementById('chat-area');
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.messages.length === 0) {
                const t = translations[currentLang];
                chatArea.innerHTML = `
                    <div class="welcome-container" id="welcome-box">
                        <h2 class="welcome-title">Veltrix AI</h2>
                        <p id="welcome-sub-text" class="welcome-sub">${t.welcomeSub}</p>
                    </div>
                `;
                return;
            }

            chatArea.innerHTML = '';
            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender}`;
                msgDiv.textContent = msg.text;
                chatArea.appendChild(msgDiv);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        };

        window.sendMessage = async function() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) {
                chat.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
                renderChatList();
            }

            chat.messages.push({ sender: 'user', text: text });
            input.value = '';
            renderActiveChat();

            // Simulate AI response / Backend call placeholder
            setTimeout(() => {
                chat.messages.push({ sender: 'ai', text: "Bu bir yapay zeka yanıtıdır." });
                renderActiveChat();
            }, 600);
        };

        window.openSettingsModal = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) select.value = currentLang;
            document.getElementById('settings-modal').style.display = 'flex';
        };

        window.closeSettingsModal = function() {
            document.getElementById('settings-modal').style.display = 'none';
        };

        window.updateLanguageFromSettings = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) applyLanguage(select.value);
            closeSettingsModal();
        };

        window.togglePlusMenu = function(e) {
            if (e) e.stopPropagation();
            document.getElementById('plus-menu').classList.toggle('show');
        };

        document.addEventListener('click', () => {
            const menu = document.getElementById('plus-menu');
            if (menu) menu.classList.remove('show');
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);
            renderChatList();
            renderActiveChat();

            const googleBtn = document.getElementById('btn-google');
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    try {
                        const result = await signInWithPopup(auth, googleProvider);
                        alert(`Hoş geldin, ${result.user.displayName || 'Kullanıcı'}!`);
                        document.getElementById('auth-modal').style.display = 'none';
                    } catch (error) {
                        console.error("Google Auth Hatası:", error);
                    }
                });
            }
        });
    </script>
</body>
</html>
