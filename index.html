        };

        let currentLang = localStorage.getItem('app_lang') || 'tr';
        let chats = [{ id: 1, title: translations[currentLang]?.newChatDefault || 'Yeni Sohbet', messages: [] }];
        let currentChatId = 1;

        // Cihaz türünü algılama fonksiyonu
        window.detectDeviceType = function() {
            const ua = navigator.userAgent;
            const width = window.innerWidth;
            
            if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua) || (width >= 768 && width <= 1024)) {
                return 'tablet';
            }
            if (/Mobi|Android|iPhone|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) || width < 768) {
                return 'phone';
            }
            return 'desktop';
        };

        // Cihaza göre arayüzü ve menü davranışını ayarlama
        window.applyDeviceOptimizations = function() {
            const deviceType = detectDeviceType();
            const sidebar = document.querySelector('.sidebar') || document.getElementById('sidebar');
            
            console.log("Algılanan Cihaz:", deviceType);

            if (sidebar) {
                if (deviceType === 'phone') {
                    // Telefonlarda menüyü varsayılan olarak gizle (çekmece/drawer mantığı)
                    sidebar.classList.add('mobile-hidden');
                    sidebar.style.position = 'absolute';
                    sidebar.style.zIndex = '1000';
                } else if (deviceType === 'tablet') {
                    // Tabletlerde esnek görünüm
                    sidebar.classList.remove('mobile-hidden');
                    sidebar.style.width = '240px';
                } else {
                    // Bilgisayarda menü tam açık ve sabit
                    sidebar.classList.remove('mobile-hidden');
                    sidebar.style.position = 'relative';
                }
            }
        };

        window.applyLanguage = function(lang) {
            const t = translations[lang] || translations.tr;
            currentLang = lang;
            localStorage.setItem('app_lang', lang);

            if (['ar', 'fa', 'he'].includes(lang)) {
                document.documentElement.dir = 'rtl';
            } else {
                document.documentElement.dir = 'ltr';
            }

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (t[key]) {
                    el.textContent = t[key];
                }
            });

            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (t[key]) {
                    el.placeholder = t[key];
                }
            });

            const langNameEl = document.getElementById('current-lang-name');
            if (langNameEl) langNameEl.textContent = t.langName;

            const defaultNames = Object.values(translations).map(val => val.newChatDefault);
            chats.forEach(chat => {
                if (defaultNames.includes(chat.title)) {
                    chat.title = t.newChatDefault;
                }
            });
            renderChatList();
        }

        window.createNewChat = function() {
            const t = translations[currentLang];
            const newChat = { id: Date.now(), title: t.newChatDefault, messages: [] };
            chats.push(newChat);
            currentChatId = newChat.id;
            renderChatList();
            renderActiveChat();
        };

        window.renderChatList = function() {
            const listEl = document.getElementById('chat-list');
            if (!listEl) return;
            listEl.innerHTML = '';
            chats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `chat-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;">${chat.title}</span>
                `;
                div.onclick = () => {
                    currentChatId = chat.id;
                    renderChatList();
                    renderActiveChat();
                };
                listEl.appendChild(div);
            });
        };

        window.renderActiveChat = function() {
            const chatArea = document.getElementById('chat-area');
            if (!chatArea) return;
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || chat.messages.length === 0) {
                const t = translations[currentLang];
                chatArea.innerHTML = `
                    <div class="welcome-container" id="welcome-box">
                        <h2 class="welcome-title">Veltrix AI</h2>
                        <p id="welcome-sub-text" class="welcome-sub" data-i18n="welcomeSub">${t.welcomeSub}</p>
                    </div>
                `;
                return;
            }

            chatArea.innerHTML = '';
            chat.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.className = `message ${msg.sender}`;
                msgDiv.textContent = msg.text;
                chatArea.appendChild(msgDiv);
            });
            chatArea.scrollTop = chatArea.scrollHeight;
        };

        window.sendMessage = async function() {
            const input = document.getElementById('user-input');
            if (!input) return;
            const text = input.value.trim();
            if (!text) return;

            const chat = chats.find(c => c.id === currentChatId);
            if (chat.messages.length === 0) {
                chat.title = text.length > 20 ? text.substring(0, 20) + '...' : text;
                renderChatList();
            }

            chat.messages.push({ sender: 'user', text: text });
            input.value = '';
            renderActiveChat();

            const t = translations[currentLang];
            setTimeout(() => {
                chat.messages.push({ sender: 'ai', text: t.aiResponse });
                renderActiveChat();
            }, 600);
        };

        window.toggleSpeechRecognition = function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("Tarayıcınız ses tanıma özelliğini desteklemiyor.");
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = currentLang;
            recognition.onresult = (event) => {
                const input = document.getElementById('user-input');
                if (input) input.value = event.results[0][0].transcript;
            };
            recognition.start();
        };

        window.openSettingsModal = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) select.value = currentLang;
            const modal = document.getElementById('settings-modal');
            if (modal) modal.style.display = 'flex';
        };

        window.closeSettingsModal = function() {
            const modal = document.getElementById('settings-modal');
            if (modal) modal.style.display = 'none';
        };

        window.updateLanguageFromSettings = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) applyLanguage(select.value);
            closeSettingsModal();
        };

        window.togglePlusMenu = function(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('plus-menu');
            if (menu) menu.classList.toggle('show');
        };

        document.addEventListener('click', () => {
            const menu = document.getElementById('plus-menu');
            if (menu) menu.classList.remove('show');
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyDeviceOptimizations();
            applyLanguage(currentLang);
            renderChatList();
            renderActiveChat();

            window.addEventListener('resize', () => {
                applyDeviceOptimizations();
            });

            const googleBtn = document.getElementById('btn-google');
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    try {
                        const result = await signInWithPopup(auth, googleProvider);
                        alert(`Hoş geldin, ${result.user.displayName || 'Kullanıcı'}!`);
                        const authModal = document.getElementById('auth-modal');
                        if (authModal) authModal.style.display = 'none';
                    } catch (error) {
                        console.error("Google Auth Hatası:", error);
                    }
                });
            }
        });
    </script>
