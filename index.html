<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veltrix AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #3b82f6;
            --border-color: #333333;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #sidebar {
            width: 260px;
            background-color: #181818;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 15px;
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .top-bar {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background-color: #2a2a2a;
        }

        .btn-primary {
            background-color: var(--accent-color);
            border: none;
        }

        .btn-primary:hover {
            background-color: #2563eb;
        }

        #chat-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .welcome-title {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .welcome-sub {
            color: #aaa;
        }

        #input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            position: relative;
            max-width: 800px;
            width: 90%;
            margin: 0 auto;
        }

        #user-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: white;
            outline: none;
        }

        .plus-menu {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            flex-direction: column;
            z-index: 100;
        }

        .plus-menu.show {
            display: flex;
        }

        .plus-menu-item {
            padding: 10px 20px;
            cursor: pointer;
            border-bottom: 1px solid var(--border-color);
        }

        .plus-menu-item:hover {
            background-color: #2a2a2a;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 1px solid var(--border-color);
        }

        .modal-content input, .modal-content select {
            padding: 10px;
            background: #121212;
            border: 1px solid var(--border-color);
            color: white;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="sidebar">
            <button id="btn-new-chat" class="btn btn-primary" style="margin-bottom: 20px;">Yeni Sohbet</button>
            <div style="flex: 1;"></div>
            <button onclick="openSettingsModal()" class="btn">⚙️ Ayarlar</button>
        </div>

        <div id="main-content">
            <div class="top-bar">
                <span id="current-lang-name">Türkçe</span>
                <button class="btn" onclick="document.getElementById('auth-modal').style.display='flex'">Giriş Yap</button>
            </div>

            <div id="chat-area">
                <h2 class="welcome-title">Veltrix AI</h2>
                <p id="welcome-sub-text" class="welcome-sub">Size nasıl yardımcı olabilirim?</p>
            </div>

            <div id="input-container">
                <button class="btn" onclick="togglePlusMenu(event)">+</button>
                <div id="plus-menu" class="plus-menu">
                    <div id="menu-gallery" class="plus-menu-item">Galeri</div>
                    <div id="menu-camera" class="plus-menu-item">Kamera</div>
                </div>

                <input type="text" id="user-input" placeholder="Bir mesaj yazın...">
                <button id="btn-send" class="btn btn-primary">Gönder</button>
            </div>
        </div>
    </div>

    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-title">Giriş Yap / Kayıt Ol</h3>
            
            <button id="btn-google" class="btn" style="background: #ffffff; color: #000; font-weight: bold;">
                <span id="btn-google-text">Google ile Giriş Yap</span>
            </button>
            
            <div style="text-align: center; color: #666; font-size: 12px;">veya</div>

            <input type="email" id="auth-email" placeholder="E-posta Adresi">
            <input type="password" id="auth-password" placeholder="Şifre">
            <button id="btn-submit-email" class="btn btn-primary">Devam Et</button>
            <a href="#" id="back-email-link" style="color: #888; font-size: 12px; text-align: center;">Geri</a>

            <hr style="border-color: var(--border-color); width: 100%;">

            <button id="btn-phone" class="btn"><span id="btn-phone-text">Telefon ile Giriş Yap</span></button>
            <span id="phone-soon-text" style="display:none; color: orange; font-size: 12px;">Pek Yakında!</span>
            <a href="#" id="back-phone-link" style="display:none; color: #888; font-size: 12px; text-align: center;">Geri</a>

            <button class="btn" onclick="document.getElementById('auth-modal').style.display='none'">İptal</button>
        </div>
    </div>

    <div id="camera-modal" class="modal">
        <div class="modal-content">
            <h3 id="cam-title">Kamera</h3>
            <div style="width: 100%; height: 180px; background: #000; border-radius: 8px;"></div>
            <button id="cam-snap-btn" class="btn btn-primary">Fotoğraf Çek</button>
            <button id="cam-close-btn" class="btn" onclick="document.getElementById('camera-modal').style.display='none'">İptal</button>
        </div>
    </div>

    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <h3 id="settings-title">Ayarlar</h3>
            <label id="settings-lang-label" for="settings-lang-select">Uygulama Dili</label>
            <select id="settings-lang-select">
                <option value="tr">Türkçe</option>
                <option value="es">Español</option>
            </select>
            <button id="btn-settings-save" class="btn btn-primary" onclick="updateLanguageFromSettings()">Kaydet</button>
            <button id="btn-settings-cancel" class="btn" onclick="closeSettingsModal()">İptal</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCpe5dskNAllAKDn0UjB_uHKBhQJfWRg1c",
            authDomain: "veltrix-ai-63b94.firebaseapp.com",
            projectId: "veltrix-ai-63b94",
            storageBucket: "veltrix-ai-63b94.firebasestorage.app",
            messagingSenderId: "539377938284",
            appId: "1:539377938284:web:efb25fd388b8a58c01cd49",
            measurementId: "G-WQJN5W5LVX"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const translations = {
            tr: {
                langName: "Türkçe",
                newChat: "Yeni Sohbet",
                welcomeSub: "Size nasıl yardımcı olabilirim?",
                placeholder: "Bir mesaj yazın...",
                send: "Gönder",
                gallery: "Galeri",
                camera: "Kamera",
                camTitle: "Kamera",
                snap: "Fotoğraf Çek",
                cancel: "İptal",
                authTitle: "Giriş Yap / Kayıt Ol",
                googleBtn: "Google ile Giriş Yap",
                emailBtn: "E-posta ile Giriş Yap",
                phoneBtn: "Telefon ile Giriş Yap",
                emailPlaceholder: "E-posta Adresi",
                passPlaceholder: "Şifre",
                submitEmail: "Devam Et",
                back: "Geri",
                phoneSoon: "Pek Yakında!",
                settings: "Ayarlar",
                settingsLang: "Uygulama Dili",
                save: "Kaydet",
                langLabel: "Lütfen uygulama dilini seçin:",
                newChatDefault: "Yeni Chat",
                msgLimit: "Mesaj limitine ulaştınız!",
                connErr: "Sunucu ile bağlantı hatası.",
                atLeastOneChat: "En az bir sohbet olmalı.",
                deleteChatTitle: "Sohbeti Sil",
                pinChatTitle: "Sabitle",
                unpinChatTitle: "Sabitlemeyi Kaldır"
            },
            es: {
                langName: "Español",
                newChat: "Nuevo Chat",
                welcomeSub: "¿Cómo puedo ayudarte hoy?",
                placeholder: "Escribe un mensaje...",
                send: "Enviar",
                gallery: "Galería",
                camera: "Cámara",
                camTitle: "Cámara",
                snap: "Tomar Foto",
                cancel: "Cancelar",
                authTitle: "Iniciar Sesión / Registrarse",
                googleBtn: "Continuar con Google",
                emailBtn: "Continuar con Email",
                phoneBtn: "Continuar con Teléfono",
                emailPlaceholder: "Correo Electrónico",
                passPlaceholder: "Contraseña",
                submitEmail: "Continuar",
                back: "Atrás",
                phoneSoon: "¡Próximamente!",
                settings: "Ajustes",
                settingsLang: "Idioma de la Aplicación",
                save: "Guardar",
                langLabel: "Por favor seleccione el idioma de la aplicación:",
                newChatDefault: "Nuevo Chat",
                msgLimit: "¡Has alcanzado el límite de mensajes! Inicia sesión para uso ilimitado.",
                connErr: "Error de conexión con el servidor.",
                atLeastOneChat: "Debe haber al menos un chat.",
                deleteChatTitle: "Eliminar chat",
                pinChatTitle: "Fijar",
                unpinChatTitle: "Desfijar"
            }
        };

        let currentLang = localStorage.getItem('app_lang') || 'tr';

        function setSafeText(id, val) {
            const el = document.getElementById(id);
            if (el) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                    el.placeholder = val;
                } else {
                    el.textContent = val;
                }
            }
        }

        function applyLanguage(lang) {
            const t = translations[lang] || translations.tr;
            currentLang = lang;
            localStorage.setItem('app_lang', lang);

            setSafeText('current-lang-name', t.langName);
            setSafeText('btn-new-chat', t.newChat);
            setSafeText('welcome-sub-text', t.welcomeSub);
            setSafeText('user-input', t.placeholder);
            setSafeText('btn-send', t.send);
            setSafeText('menu-gallery', t.gallery);
            setSafeText('menu-camera', t.camera);
            setSafeText('cam-title', t.camTitle);
            setSafeText('cam-snap-btn', t.snap);
            setSafeText('cam-close-btn', t.cancel);
            setSafeText('modal-title', t.authTitle);
            setSafeText('btn-google-text', t.googleBtn);
            setSafeText('btn-email-text', t.emailBtn);
            setSafeText('btn-phone-text', t.phoneBtn);
            setSafeText('auth-email', t.emailPlaceholder);
            setSafeText('auth-password', t.passPlaceholder);
            setSafeText('btn-submit-email', t.submitEmail);
            setSafeText('back-email-link', t.back);
            setSafeText('back-phone-link', t.back);
            setSafeText('phone-soon-text', t.phoneSoon);
            setSafeText('settings-title', t.settings);
            setSafeText('settings-lang-label', t.settingsLang);
            setSafeText('btn-settings-save', t.save);
            setSafeText('btn-settings-cancel', t.cancel);
        }

        window.openSettingsModal = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) select.value = currentLang;
            const modal = document.getElementById('settings-modal');
            if (modal) modal.style.display = 'flex';
        };

        window.closeSettingsModal = function() {
            const modal = document.getElementById('settings-modal');
            if (modal) modal.style.display = 'none';
        };

        window.updateLanguageFromSettings = function() {
            const select = document.getElementById('settings-lang-select');
            if (select) {
                applyLanguage(select.value);
            }
            closeSettingsModal();
        };

        window.togglePlusMenu = function(e) {
            if (e) e.stopPropagation();
            const menu = document.getElementById('plus-menu');
            if (menu) menu.classList.toggle('show');
        };

        document.addEventListener('click', () => {
            const menu = document.getElementById('plus-menu');
            if (menu) menu.classList.remove('show');
        });

        window.addEventListener('DOMContentLoaded', () => {
            applyLanguage(currentLang);

            const googleBtn = document.getElementById('btn-google') || document.getElementById('btn-google-text')?.parentElement;
            if (googleBtn) {
                googleBtn.addEventListener('click', async () => {
                    try {
                        const result = await signInWithPopup(auth, googleProvider);
                        const user = result.user;
                        console.log("Google Girişi Başarılı:", user);
                        
                        const authModal = document.getElementById('auth-modal');
                        if (authModal) authModal.style.display = 'none';
                    } catch (error) {
                        console.error("Google Auth Hatası:", error);
                    }
                });
            }
        });
    </script>
</body>
</html>
